name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version and architecture
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' scripts/Info.plist)
          test "$release_version" = "$bundle_version"
          test "$(uname -m)" = "arm64"
          test -f "docs/releases/$release_version.md"
      - name: Run tests
        run: swift test
      - name: Build and verify app
        run: |
          set -euo pipefail
          ./scripts/build.sh
          codesign --verify --deep --strict dist/NotchOTP.app
          test "$(lipo -archs dist/NotchOTP.app/Contents/MacOS/NotchOTP)" = "arm64"
      - name: Create installer disk image
        run: ./scripts/create-dmg.sh dist/NotchOTP.app "dist/NotchOTP-${GITHUB_REF_NAME}-macOS-arm64.dmg"
      - name: Prepare download and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mv NotchOTP.zip "NotchOTP-${GITHUB_REF_NAME}-macOS-arm64.zip"
          shasum -a 256 "NotchOTP-${GITHUB_REF_NAME}-macOS-arm64.zip" "NotchOTP-${GITHUB_REF_NAME}-macOS-arm64.dmg" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/NotchOTP-${GITHUB_REF_NAME}-macOS-arm64.zip" \
            "dist/NotchOTP-${GITHUB_REF_NAME}-macOS-arm64.dmg" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "NotchOTP $release_version" \
            --notes-file "docs/releases/$release_version.md" \
            --latest
